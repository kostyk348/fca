name: Bug report
description: Wrong pixels, a crash, or non-deterministic output
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact input (PPM/rawvideo params) and the wrong output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: fca 0.3.0
    validations:
      required: true
  - type: checkboxes
    id: repro
    attributes:
      label: Determinism
      options:
        - label: The same spec reproduces this on every run (it is not flaky)
          required: true
