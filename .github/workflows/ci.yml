name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      - name: "Smoke: PPM upscale + determinism"
        shell: bash
        run: |
          # относительные пути: /tmp не существует для Windows-python
          python3 - <<'PY'
          import random
          random.seed(42)
          w, h = 64, 48
          with open('smoke_in.ppm', 'wb') as f:
              f.write(f'P6\n{w} {h}\n255\n'.encode())
              f.write(bytes(random.randrange(256) for _ in range(w*h*3)))
          PY
          ./target/release/fca_upscale smoke_in.ppm smoke_out1.ppm --rule fuzzy
          ./target/release/fca_upscale smoke_in.ppm smoke_out2.ppm --rule fuzzy
          cmp smoke_out1.ppm smoke_out2.ppm

      - name: "Smoke: rawvideo pipe (gray/yuv444)"
        shell: bash
        run: |
          head -c 6400 /dev/urandom > smoke_f.gray
          ./target/release/fca_video 40 40 fuzzy < smoke_f.gray > smoke_g.out
          test "$(stat -c%s smoke_g.out 2>/dev/null || stat -f%z smoke_g.out)" -eq 25600
          head -c 19200 /dev/urandom > smoke_f.y4
          ./target/release/fca_video 40 40 fuzzy --yuv444 --dn 100 < smoke_f.y4 > smoke_c.out
          test "$(stat -c%s smoke_c.out 2>/dev/null || stat -f%z smoke_c.out)" -eq 76800
